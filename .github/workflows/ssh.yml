name: Ubuntu SSH Server

on:
  workflow_dispatch:
  push:

jobs:
  ssh-server:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Update system
        run: sudo apt update

      - name: Install packages
        run: |
          sudo apt install -y \
            curl \
            wget \
            git \
            vim \
            tmux \
            htop \
            net-tools

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
